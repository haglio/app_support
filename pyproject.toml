[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app-support"
version = "0.1.0"
requires-python = ">=3.10"
# Standard library only, on purpose. This package is installed into every app's
# venv, so a dependency here becomes a dependency everywhere.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    # The scanner behind app_support.dead_code. A dev dependency of every repo
    # that asks for that gate, including this one -- never a dependency of the
    # package, which installs into every app's venv.
    "vulture",
]

# Consumers install this editable from a local path (see README); it is never
# published, so it must not appear in their own [project.dependencies] — pip
# would go looking for it on PyPI.
[tool.setuptools.packages.find]
include = ["app_support*"]

[tool.pytest.ini_options]
# The second plugin is the content guard's enforcement check, which this repo
# adopts the same way every consumer will: one line, and the tracked tree is
# scanned on every run.
addopts = "-p no:cacheprovider -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]
