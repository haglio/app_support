[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app-support"
version = "0.1.0"
requires-python = ">=3.10"
# Standard library only, on purpose. This package is installed into every app's
# venv, so a dependency here becomes a dependency everywhere.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

# Consumers install this editable from a local path (see README); it is never
# published, so it must not appear in their own [project.dependencies] — pip
# would go looking for it on PyPI.
[tool.setuptools.packages.find]
include = ["app_support*"]

[tool.pytest.ini_options]
# The second plugin is the content guard's enforcement check, which this repo
# adopts the same way every consumer will: one line, and the tracked tree is
# scanned on every run.
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~1.5 s, so 60 s clears it forty times over and can
# only bite on a hang. The thread method prints the hung stack, which is what
# turns a stalled required check into a one-line diagnosis. tests/test_timeouts.py
# holds both halves of it.
addopts = "-p no:cacheprovider -p app_support.sanitize.pytest_plugin --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
