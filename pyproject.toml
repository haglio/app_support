[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "app-support"
# The version is the tag on the landing, read by setuptools-scm -- see
# [tool.setuptools_scm], held by the family's gates. Written down here it
# said 0.1.0 for the life of the repo, which is no use to a consumer that wants
# to name the copy of this package it was built against.
dynamic = ["version"]
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# Standard library only, on purpose. This package is installed into every app's
# venv, so a dependency here becomes a dependency everywhere.
dependencies = []

[project.optional-dependencies]
# Every requirement carries a ceiling, here and in the ten consumers: without one
# each run installs whatever PyPI served that morning, which is how the family's
# gates came to run a major version of the imaging stack past the one the
# developer machines have. The floors are what the machines actually hold today;
# the family's dependency gate refuses a requirement with no upper bound.
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    # The scanner powering app_support.dead_code. A dev dependency of every repo
    # that asks for that gate, including this one -- never a dependency of the
    # package, which installs into every app's venv.
    "vulture>=2.16,<3",
    # The linter powering app_support.lint, at the one version the family's gate
    # accepts (lint.RUFF_VERSION): a dev dependency of every repo that asks for
    # that gate, this one included, never of the package.
    "ruff==0.16.6",
    # The measuring app_support.coverage_gate asks for, collected while the unit
    # suite runs rather than in a pass of its own. A dev dependency of every repo
    # that asks for that gate, this one included, never of the package.
    "pytest-cov>=7,<8",
]

# Consumers name a tag of this repository in their own [project.dependencies],
# so pip fetches the copy they were built against instead of resolving a name
# PyPI has never heard of.
[tool.setuptools.packages.find]
include = ["app_support*"]

# The version is `git describe` of the checkout being built: a landing's tag
# exactly, and that tag plus a development suffix for a checkout sitting past
# one. Nothing is written back into the tree, so a consumer's pin and this
# package's own idea of its version can never disagree.
[tool.setuptools_scm]

# The one thing this machine runs out of this checkout: the production updater,
# app_support.production_update, which keeps every checkout beside this one at
# what has shipped. Every launcher of the family runs it just before it starts
# its app, from this checkout's own venv, and a scheduled task runs a pass over
# all of them every two minutes. The launcher is rendered from this by
# `python -m app_support.launcher --write`, and
# `python -m app_support.windows_settings --write` registers the task.
[tool.haglio.launchers."launch_production_updater.vbs"]
app = "Production updater"
interpreter = "pythonw.exe"
run = "-m app_support.production_update"
environment = { HAGLIO_UPKEEP = "1" }

[tool.haglio.scheduled-tasks."Production updater"]
launcher = "launch_production_updater.vbs"
every-minutes = 2

# Declared, so that the updater's own launcher waits out an update of this
# checkout and brings it up first, as every app's launcher does for its own.
[tool.haglio.production]

# What the family's gates (app_support.gates) let stand here, each for the
# reason beside it. An entry nothing is reported for any more fails the gate.
[tool.haglio.dead-code]
# Fields of records this package writes for the apps: Fun Time and Evolver read
# a favorite's video and page, Fun Time and Line a run's length and exit.
unread-dataclass-fields = ["Favorite.video", "Favorite.page", "RunRecord.short",
                           "RunRecord.exit_code"]
# pytest hands the coverage gate's collection hook the run's items by name; the
# hook reads only the run's config.
unread-arguments = ["app_support/coverage_gate.py: items"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest tests are the
# updater's and the hotfix route's, each making up to 160 real git calls:
# about 30 s on a developer machine running other suites, and up to 220 s on
# one carrying a dozen of them (measured 2026-10-24 and 25).
# --timeout-method=thread is the half that pays for itself: it dumps the
# stack of the test that stopped, which turns a stalled required check into a
# one-line diagnosis. app_support.gates holds all three halves of it.
addopts = "-p no:cacheprovider -p app_support.sanitize.pytest_plugin -p app_support.gates.pytest_plugin -p app_support.coverage_gate --cov --cov-report= --timeout=240 --timeout-method=thread"
testpaths = ["tests"]
