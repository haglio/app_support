line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: what the family config found here, to be worked off rule by rule.
    "PLW1510", "PLR2004", "PT011", "RUF001", "PLC0415", "RUF002", "PLR0913"]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "PLW1510", "PLR2004", "PT011", "RUF001", "PLC0415", "RUF002", "PLR0913"]

[format]
quote-style = "double"
