name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# Runs on windows-latest: app_support wraps Windows-only subprocess behaviour
# (STARTUPINFO / SW_HIDE) and its tests exercise it, so an ubuntu runner reports
# 2 failures for attributes that don't exist off-Windows. The editable install
# MUST use compat mode or tests/test_install.py fails -- the repo dir shares the
# package's name and would otherwise win as a namespace shadow.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, compat mode)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Run the suite
        run: python -m pytest -q
