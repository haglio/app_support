# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@claude/random-test-order
    with:
      siblings: ""
      python-version: "3.12"
      timeout-minutes: 3

  # A consumer built against the candidate. This package installs editable into
  # every app's venv, so a change here lands in ten repos the moment it merges --
  # with no version to bump and nothing but this repo's own suite deciding it
  # may. broker is the cheapest repo that uses it as an application does.
  consumer:
    uses: haglio/.github/.github/workflows/merge-gate.yml@claude/random-test-order
    with:
      repo: broker
      siblings: "shared_ui"
      python-version: "3.12"
      timeout-minutes: 8

  # What the machine this is developed on would say. It runs 3.14 and the gate
  # runs 3.12, and the two evaluate annotations differently (PEP 649), so a
  # branch can be green here and fail to collect there -- or the reverse, once
  # the floor moves. On `push` only: never on a pull request and never in the
  # queue, so this reads without gating and nothing here can hold up a landing.
  next-python:
    if: github.event_name == 'push'
    uses: haglio/.github/.github/workflows/merge-gate.yml@claude/random-test-order
    with:
      siblings: ""
      python-version: "3.14"
      timeout-minutes: 3
