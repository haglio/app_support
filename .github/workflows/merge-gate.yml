# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Three minutes was the suite plus a flake-gate step costing under thirty
  # seconds, and a branch that changes this repo's own gate tests pays far more
  # than that: twenty-one of them, repeated ten times each on a busy machine,
  # take about eight minutes. That ceiling has already cancelled a run of this
  # repo's queue (35405306955), which reports nothing and turns a green branch
  # away -- the failure app_support.flake_gate's --budget-minutes exists to end,
  # once the workflow that calls the gate passes one.
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: ""
      python-version: "3.14"
      timeout-minutes: 15

  # A consumer built against the candidate. This package installs editable into
  # every app's venv, so a change here lands in ten repos the moment it merges --
  # with no version to bump and nothing but this repo's own suite deciding it
  # may. broker is the cheapest repo that uses it as an application does.
  consumer:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      repo: broker
      siblings: "shared_ui"
      python-version: "3.14"
      timeout-minutes: 8

  # A version for each landing, so a consumer can pin the copy it was built
  # against instead of running whatever checkout sits beside it. The tag is the
  # version: pyproject reads it with setuptools-scm.
  tag:
    if: github.event_name == 'push'
    needs: full-suite
    uses: haglio/.github/.github/workflows/tag-the-landing.yml@main
    permissions:
      contents: write
